<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Medication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; padding: 20px; font-family: 'Inter', system-ui, sans-serif; }
        .edit-card { background: #fff; border-radius: 14px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="edit-card">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="mb-0"><i class="bi bi-capsule text-success"></i> Edit Medication</h3>
                    <a href="/medications" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Back
                    </a>
                </div>

                <form th:action="@{/medications/update/{id}(id=${medication.id})}"
                      th:object="${medication}" method="post" novalidate>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                            <div th:if="${#fields.hasErrors('name')}" class="text-danger small mt-1"
                                 th:errors="*{name}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Generic / Active Ingredient</label>
                            <input type="text" class="form-control" th:field="*{genericName}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">Category</label>
                            <select class="form-select" th:field="*{category}">
                                <option value="">Select...</option>
                                <option th:each="c : ${categories}" th:value="${c}"
                                        th:text="${#strings.replace(c.name(),'_',' ')}"></option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-semibold">Default Dosage</label>
                            <input type="text" class="form-control" th:field="*{defaultDosage}">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label fw-semibold">Unit</label>
                            <select class="form-select" th:field="*{defaultDosageUnit}">
                                <option value="">—</option>
                                <option th:each="u : ${dosageUnits}" th:value="${u}" th:text="${u}"></option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-semibold">Manufacturer</label>
                            <input type="text" class="form-control" th:field="*{manufacturer}">
                        </div>
                        <div class="col-12 mb-4">
                            <label class="form-label fw-semibold">Notes / Description</label>
                            <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                        </div>

                        <div class="col-12 mb-4">
                            <div class="alert alert-info mb-0 py-2">
                                <i class="bi bi-info-circle me-1"></i>
                                Active / Inactive status is not editable here.
                                Use the <strong>Activate</strong> or <strong>Deactivate</strong> buttons on
                                the list page — the change is written to the audit log with a reason.
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="/medications" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-save me-1"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
