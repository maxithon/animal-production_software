<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Import Complete</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { background: #f0f4f8; font-family: 'DM Sans', sans-serif; color: #0f172a; }
        .success-banner {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white; padding: 40px 32px; text-align: center;
            border-radius: 14px; margin-bottom: 24px;
        }
        .success-banner i { font-size: 3.5rem; display: block; margin-bottom: 12px; }
        .success-banner h3 { font-weight: 700; margin: 0 0 8px; }
        .success-banner p  { opacity: .9; margin: 0; font-size: .92rem; }

        .card-panel {
            background: white; border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.07);
            padding: 24px; margin-bottom: 20px;
        }
        .section-head {
            font-size: .7rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: .08em;
            color: #94a3b8; margin-bottom: 14px;
            padding-bottom: 8px; border-bottom: 1.5px solid #f1f5f9;
        }

        .summary-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
            gap: 14px;
        }
        .summary-item {
            background: #f8fafc; border-radius: 10px;
            padding: 16px; text-align: center;
        }
        .summary-item .n { font-size: 1.75rem; font-weight: 800; color: #1a5f7a; }
        .summary-item .l { font-size: .7rem; color: #64748b;
                           text-transform: uppercase; letter-spacing: .05em;
                           font-weight: 700; margin-top: 4px; }

        .tag-cloud {
            background: #f8fafc; border-radius: 10px;
            padding: 16px; font-family: ui-monospace, monospace;
            font-size: .78rem; max-height: 300px; overflow: auto;
            white-space: pre-wrap; line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container-fluid px-4 pb-5 pt-4" style="max-width:1000px;">

    <div class="success-banner">
        <i class="bi bi-check-circle-fill"></i>
        <h3>Import complete</h3>
        <p>
            <strong th:text="${result.createdCount}">0</strong> animals were created successfully
            from your upload.
        </p>
    </div>

    <div class="card-panel">
        <div class="section-head">Summary</div>
        <div class="summary-grid">
            <div class="summary-item">
                <div class="n" th:text="${result.createdCount}">0</div>
                <div class="l">Created</div>
            </div>
            <div class="summary-item">
                <div class="n" th:text="${result.totalRows}">0</div>
                <div class="l">Rows in file</div>
            </div>
            <div class="summary-item">
                <div class="n" th:text="${result.okRows}">0</div>
                <div class="l">Ready</div>
            </div>
            <div class="summary-item">
                <div class="n" th:text="${result.warningRows}">0</div>
                <div class="l">Warnings</div>
            </div>
            <div class="summary-item">
                <div class="n" th:text="${result.errorRows}">0</div>
                <div class="l">Errors (skipped)</div>
            </div>
        </div>

        <div class="mt-3" style="font-size:.82rem;color:#64748b;"
             th:if="${result.importBatchTimestamp != null}">
            <i class="bi bi-clock-history me-1"></i>
            Import recorded at <strong th:text="${result.importBatchTimestamp}"></strong>
            <span th:if="${result.importBatchId != null}">
                &nbsp;·&nbsp; Batch ID: <code th:text="${result.importBatchId}"></code>
            </span>
        </div>
    </div>

    <div class="card-panel" th:if="${result.createdTags != null and !result.createdTags.isEmpty()}">
        <div class="section-head">Created tags (<span th:text="${result.createdTags.size()}">0</span>)</div>
        <div class="tag-cloud" th:text="${#strings.listJoin(result.createdTags, ', ')}">GOAT-000001, GOAT-000002, ...</div>
    </div>

    <div class="d-flex gap-2 justify-content-end">
        <a href="/livestock/bulk-import" class="btn btn-outline-primary">
            <i class="bi bi-cloud-upload me-1"></i> Import another file
        </a>
        <a href="/livestock/list" class="btn btn-success">
            <i class="bi bi-grid-fill me-1"></i> View livestock list
        </a>
    </div>
</div>

</body>
</html>
