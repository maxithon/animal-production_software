<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Animal Production System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        .background {
            min-height: 100vh;
            background-image: linear-gradient(
                to right,
                rgba(0, 34, 68, 0.75),
                rgba(0, 34, 68, 0.75)
            ),
            url('../images/kigali_city.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            padding: 40px 0;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .register-header {
            background: linear-gradient(135deg, #002244 0%, #004488 100%);
            color: white;
            padding: 30px;
            border-radius: 12px 12px 0 0;
        }

        .btn-register {
            background: linear-gradient(135deg, #002244 0%, #004488 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
        }

        .btn-register:hover {
            background: linear-gradient(135deg, #004488 0%, #0066cc 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 34, 68, 0.3);
        }

        .form-label {
            font-weight: 500;
            color: #333;
        }

        .form-control:focus, .form-select:focus {
            border-color: #002244;
            box-shadow: 0 0 0 0.2rem rgba(0, 34, 68, 0.25);
        }
    </style>
</head>
<body>
<div class="background">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="register-card">
                    <div class="register-header text-center">
                        <h2><i class="bi bi-person-plus-fill"></i> Create Account</h2>
                        <p class="mb-0">Animal Production Management System</p>
                    </div>

                    <div class="card-body p-4">

                        <!-- Success Message -->
                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Error Message -->
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/register/new}" th:object="${users}" method="post">

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <i class="bi bi-envelope"></i> Email Address
                                </label>
                                <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        th:field="*{email}"
                                        placeholder="Enter your email"
                                        required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock"></i> Password
                                </label>
                                <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        th:field="*{password}"
                                        placeholder="Create a strong password"
                                        minlength="6"
                                        required>
                                <div class="form-text">Password must be at least 6 characters long</div>
                            </div>

                            <!-- Confirm Password -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">
                                    <i class="bi bi-lock-fill"></i> Confirm Password
                                </label>
                                <input
                                        type="password"
                                        class="form-control"
                                        id="confirmPassword"
                                        name="confirmPassword"
                                        placeholder="Re-enter your password"
                                        required>
                            </div>

                            <!-- User Type -->
                            <div class="mb-3">
                                <label for="userType" class="form-label">
                                    <i class="bi bi-person-badge"></i> User Type
                                </label>
                                <select
                                        class="form-select"
                                        id="userType"
                                        th:field="*{userTypeIdValue}"
                                        required>
                                    <option value="">Select user type...</option>
                                    <option
                                            th:each="type : ${getAllTypes}"
                                            th:value="${type.userTypeId}"
                                            th:text="${type.userTypeName}">
                                    </option>
                                </select>
                            </div>

                            <!-- Active Status (Hidden/Default) -->
                            <input type="hidden" th:field="*{active}" th:value="true">

                            <!-- Terms and Conditions -->
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    I agree to the <a href="#" class="text-decoration-none">Terms and Conditions</a>
                                </label>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-primary btn-register">
                                    <i class="bi bi-person-check"></i> Register
                                </button>
                            </div>

                            <!-- Login Link -->
                            <div class="text-center">
                                <p class="mb-0">Already have an account?
                                    <a th:href="@{/}" class="text-decoration-none fw-bold">Login here</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Password Validation Script -->
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            e.preventDefault();
            alert('Passwords do not match!');
            document.getElementById('confirmPassword').classList.add('is-invalid');
        }
    });
</script>
</body>
</html>
