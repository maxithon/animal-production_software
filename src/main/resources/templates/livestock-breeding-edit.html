<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Breeding Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; }
        .page-header { background: white; border-bottom: 1px solid #dee2e6; padding: 20px 30px; margin-bottom: 24px; }
        .content-card { background: white; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); padding: 28px; max-width: 860px; margin: 0 auto 32px; }
        .section-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; border-bottom: 1px solid #e9ecef; padding-bottom: 6px; margin-bottom: 16px; margin-top: 8px; }
    </style>
</head>
<body>

<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4 class="mb-1"><i class="bi bi-pencil-square text-warning me-2"></i>Edit Breeding Record</h4>
        <small class="text-muted">Update breeding event details</small>
    </div>
    <div class="d-flex gap-2">
        <a th:href="@{/livestock/breeding}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Dashboard
        </a>
        <a th:href="@{/livestock/breeding/list}" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-list me-1"></i> View All
        </a>
    </div>
</div>

<div class="container-fluid px-4">
    <div class="content-card">

        <form th:action="@{/livestock/breeding/update/{id}(id=${breeding.id})}"
              th:object="${breeding}" method="post">

            <p class="section-title">Animal &amp; Breeding Details</p>
            <div class="row g-3 mb-4">

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Female Animal <span class="text-danger">*</span></label>
                    <select th:field="*{livestockIdValue}" class="form-select" required>
                        <option value="">— Select Female Animal —</option>
                        <option th:each="ls : ${femaleLivestock}"
                                th:value="${ls.id}"
                                th:text="${ls.tagNumber + (ls.livestockCategory != null ? ' (' + ls.livestockCategory.name + ')' : '')}"
                                th:selected="${breeding.livestockIdValue != null and breeding.livestockIdValue == ls.id.toString()}">
                        </option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Male Animal (Sire)</label>
                    <select th:field="*{maleLivestockIdValue}" class="form-select">
                        <option value="">— Select Male Animal (optional) —</option>
                        <option th:each="ls : ${maleLivestock}"
                                th:value="${ls.id}"
                                th:text="${ls.tagNumber + (ls.livestockCategory != null ? ' (' + ls.livestockCategory.name + ')' : '')}"
                                th:selected="${breeding.maleLivestockIdValue != null and breeding.maleLivestockIdValue == ls.id.toString()}">
                        </option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Breeding Date <span class="text-danger">*</span></label>
                    <input th:field="*{breedingDate}" type="date" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Breeding Method</label>
                    <select th:field="*{breedingMethod}" class="form-select">
                        <option value="">— Select Method —</option>
                        <option value="NATURAL">Natural Mating</option>
                        <option value="ARTIFICIAL_INSEMINATION">Artificial Insemination (AI)</option>
                        <option value="EMBRYO_TRANSFER">Embryo Transfer</option>
                    </select>
                </div>

            </div>

            <p class="section-title">Expected Dates</p>
            <div class="row g-3 mb-4">

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Expected Pregnancy Check Date</label>
                    <input th:field="*{expectedPregnancyCheckDate}" type="date" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Expected Due / Birth Date</label>
                    <input th:field="*{expectedDueDate}" type="date" class="form-control">
                </div>

            </div>

            <p class="section-title">Veterinarian &amp; Status</p>
            <div class="row g-3 mb-4">

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Attending Veterinarian</label>
                    <select th:field="*{veterinarianIdValue}" class="form-select">
                        <option value="">— Select Veterinarian (optional) —</option>
                        <option th:each="v : ${vets}"
                                th:value="${v.id}"
                                th:text="${v.fullName + (v.licenseNumber != null ? ' (' + v.licenseNumber + ')' : '')}"
                                th:selected="${breeding.veterinarianIdValue != null and breeding.veterinarianIdValue == v.id.toString()}">
                        </option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Status</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="PENDING">Pending</option>
                        <option value="CONFIRMED_PREGNANT">Confirmed Pregnant</option>
                        <option value="FAILED">Failed</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </div>

            </div>

            <p class="section-title">Additional Notes</p>
            <div class="mb-4">
                <textarea th:field="*{notes}" class="form-control" rows="3"
                          placeholder="Observations, semen batch info…"></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-save me-1"></i> Update Record
                </button>
                <a th:href="@{/livestock/breeding/list}" class="btn btn-outline-secondary">Cancel</a>
            </div>

        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
