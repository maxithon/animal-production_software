<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Record Updated</title>
</head>
<body style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background-color:#f4f6f9;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f9;padding:24px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;overflow:hidden;
                    box-shadow:0 4px 20px rgba(0,0,0,0.10);max-width:600px;width:100%;">

                <tr>
                    <td style="background:linear-gradient(135deg,#1d4ed8,#3b82f6);padding:26px 32px;color:#ffffff;">
                        <div style="font-size:2.4rem;line-height:1;" th:text="${emoji}">📝</div>
                        <h2 style="margin:10px 0 4px;font-size:1.25rem;font-weight:700;"
                            th:text="${title}">Record Updated</h2>
                        <p style="margin:0;opacity:0.85;font-size:0.82rem;">
                            Animal Livestock Management System &mdash; Auto Notification
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:26px 32px;">

                        <p style="color:#374151;font-size:0.95rem;line-height:1.6;margin:0 0 18px;">
                            A <strong th:text="${entityLabel}">record</strong> was updated in the livestock system.
                        </p>

                        <table width="100%" cellpadding="0" cellspacing="0"
                               style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;
                          padding:16px 20px;margin-bottom:20px;">
                            <tr>
                                <td style="padding:5px 0;">
                                    <span style="color:#6b7280;font-size:0.78rem;display:block;">Animal Tag</span>
                                    <strong style="font-size:1rem;color:#1e293b;" th:text="${tagNumber}">—</strong>
                                </td>
                                <td style="padding:5px 0;">
                                    <span style="color:#6b7280;font-size:0.78rem;display:block;">Category</span>
                                    <span style="color:#1e293b;" th:text="${category}">—</span>
                                </td>
                            </tr>
                            <tr th:if="${breedingDate != null}">
                                <td style="padding:5px 0;">
                                    <span style="color:#6b7280;font-size:0.78rem;display:block;">Breeding Date</span>
                                    <span style="color:#1e293b;" th:text="${breedingDate}">—</span>
                                </td>
                                <td style="padding:5px 0;">
                                    <span style="color:#6b7280;font-size:0.78rem;display:block;">Status</span>
                                    <span style="color:#1e293b;" th:text="${status != null ? status : '—'}">—</span>
                                </td>
                            </tr>
                            <tr th:if="${birthDate != null}">
                                <td style="padding:5px 0;">
                                    <span style="color:#6b7280;font-size:0.78rem;display:block;">Birth Date</span>
                                    <span style="color:#1e293b;" th:text="${birthDate}">—</span>
                                </td>
                                <td style="padding:5px 0;">
                                    <span style="color:#6b7280;font-size:0.78rem;display:block;">Offspring Count</span>
                                    <span style="color:#1e293b;"
                                          th:text="${offspringCount != null ? offspringCount : '—'}">—</span>
                                </td>
                            </tr>
                        </table>

                        <p style="color:#374151;font-size:0.92rem;font-weight:700;margin:0 0 6px;">
                            What changed
                        </p>
                        <p style="color:#1f2937;font-size:0.9rem;line-height:1.55;margin:0 0 18px;
                      padding:12px 16px;background:#fef3c7;
                      border-left:4px solid #d97706;border-radius:6px;"
                           th:text="${changeSummary}">—</p>

                        <p style="color:#9ca3af;font-size:0.78rem;margin:16px 0 0;">
                            Notification sent: <span th:text="${when}">—</span>
                        </p>

                    </td>
                </tr>

                <tr>
                    <td style="background:#f9fafb;padding:16px 32px;text-align:center;
                     border-top:1px solid #e5e7eb;">
                        <p style="color:#9ca3af;font-size:0.72rem;margin:0;">
                            Animal Production System &bull; Automated Notification
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
