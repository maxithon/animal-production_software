<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Record Weight</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { background: #f0f4f8; font-family: 'DM Sans', sans-serif; color: #0f172a; }
        .page-header {
            background: linear-gradient(135deg, #1a5f7a, #2e8b9e);
            color: white; padding: 24px 32px; margin-bottom: 24px;
        }
        .card-panel {
            background: white; border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.07);
            padding: 24px; margin-bottom: 20px;
            max-width: 720px; margin-left: auto; margin-right: auto;
        }
        .section-head {
            font-size: .7rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: .08em;
            color: #94a3b8; margin-bottom: 14px;
            padding-bottom: 8px; border-bottom: 1.5px solid #f1f5f9;
        }
        .last-weight-callout {
            background: #f0fdf4; border-left: 4px solid #10b981;
            padding: 12px 16px; border-radius: 8px;
            font-size: .85rem; color: #065f46;
            margin-bottom: 20px;
        }
        label.form-label { font-weight: 600; font-size: .85rem; }
    </style>
</head>
<body>

<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4 style="font-weight:700;margin:0;">
            <i class="bi bi-plus-circle me-2"></i>Record Weight
        </h4>
        <small style="opacity:.9">
            <span th:text="${animal.tagNumber}">GOAT-000</span>
            <span th:if="${animal.livestockCategory != null}"
                  th:text="' · ' + ${animal.livestockCategory.name}"></span>
        </small>
    </div>
    <a th:href="@{'/livestock/' + ${animal.id} + '/weight'}" class="btn btn-light btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back to history
    </a>
</div>

<div class="container-fluid px-4 pb-5">

    <div class="card-panel">

        <div th:if="${lastWeighing != null}" class="last-weight-callout">
            <i class="bi bi-info-circle me-1"></i>
            Last weighing:
            <strong th:text="${lastWeighing.weightFormatted}"></strong>
            on <strong th:text="${lastWeighing.weighedOn}"></strong>.
            Enter the new weight below.
        </div>
        <div th:if="${lastWeighing == null}" class="last-weight-callout">
            <i class="bi bi-stars me-1"></i>
            This is the first weighing for this animal. It will start the growth curve.
        </div>

        <div class="section-head">New weighing</div>

        <form th:action="@{'/livestock/' + ${animal.id} + '/weight/add'}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Weighed on <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" name="weighedOn"
                           th:value="${today}" th:max="${today}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Weight (kg) <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" min="0.01" max="2000"
                           class="form-control" name="weightKg"
                           placeholder="e.g. 45.5" required autofocus>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Method</label>
                    <select class="form-select" name="weightMethod">
                        <option value="SCALE">Scale</option>
                        <option value="ESTIMATED">Estimated</option>
                        <option value="TAPE">Tape measure</option>
                        <option value="HEART_GIRTH">Heart girth</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Head count</label>
                    <input type="number" min="1" class="form-control"
                           name="headCount" value="1">
                    <small class="text-muted">For a batch average, enter how many animals this covers.</small>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Body condition</label>
                    <select class="form-select" name="bodyCondition">
                        <option value="">— Not recorded —</option>
                        <option value="POOR">Poor</option>
                        <option value="MODERATE">Moderate</option>
                        <option value="GOOD">Good</option>
                        <option value="FAT">Fat</option>
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea class="form-control" name="notes" rows="2"
                              placeholder="Any observations (e.g. after illness, before sale)..."></textarea>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle me-1"></i> Save weighing
                </button>
                <a th:href="@{'/livestock/' + ${animal.id} + '/weight'}"
                   class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
