<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Treatment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .page-header {
            background: white;
            border-bottom: 2px solid #e2e8f0;
            padding: 18px 32px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-header h4 { margin: 0; font-weight: 700; color: #1a202c; }
        .page-header .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-back-report {
            background: #8b5cf6;
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s;
            border: none;
        }
        .btn-back-report:hover { background: #7c3aed; color: white; }
        .content-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            padding: 32px 36px;
            max-width: 900px;
            margin: 0 auto 40px;
        }
        .section-title {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #718096;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 6px;
            margin-bottom: 18px;
            margin-top: 12px;
        }
        .form-label { font-weight: 600; font-size: 0.875rem; color: #2d3748; margin-bottom: 4px; }
        .form-control, .form-select {
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color .15s, box-shadow .15s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
        }

        .payment-status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .payment-status-badge.unpaid { background: #fee2e2; color: #991b1b; }
        .payment-status-badge.partial { background: #fef3c7; color: #92400e; }
        .payment-status-badge.paid { background: #d1fae5; color: #065f46; }
        .payment-status-badge.overdue { background: #fecaca; color: #7f1d1d; }

        @media (max-width: 768px) {
            .content-card { padding: 20px; }
            .page-header { padding: 14px 16px; flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="page-header">
    <div>
        <h4><i class="bi bi-pencil-square text-warning me-2"></i>Edit Treatment Record</h4>
        <small class="text-muted">Update treatment details</small>
    </div>
    <div class="header-actions">
        <a th:href="${returnUrl != null ? returnUrl : '/livestock/treatment-report'}" class="btn-back-report">
            <i class="bi bi-arrow-left"></i> Back to Reports
        </a>
        <a th:href="@{/livestock/treatments}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-list-ul me-1"></i> All Treatments
        </a>
    </div>
</div>

<div class="container-fluid px-4">
    <div class="content-card">
        <form th:action="@{/livestock/treatments/update/{id}(id=${treatment.id})}"
              th:object="${treatment}" method="post">

            <input type="hidden" name="returnUrl" th:value="${returnUrl}">

            <!-- ── Animal & Medication ── -->
            <p class="section-title"><i class="bi bi-tag me-1"></i> Animal &amp; Medication</p>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Animal <span class="text-danger">*</span></label>
                    <select th:field="*{livestockIdValue}" class="form-select" required>
                        <option value="">— Select Animal —</option>
                        <option th:each="ls : ${livestockList}"
                                th:value="${ls.id}"
                                th:text="${ls.tagNumber + (ls.livestockCategory != null ? ' · ' + ls.livestockCategory.name : '')}">
                        </option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Medication</label>
                    <select th:field="*{medicationIdValue}" class="form-select">
                        <option value="">— Select Medication —</option>
                        <option th:each="med : ${medicationList}"
                                th:value="${med.id}"
                                th:text="${med.name}">
                        </option>
                    </select>
                </div>
            </div>

            <!-- ── Treatment Details ── -->
            <p class="section-title"><i class="bi bi-calendar3 me-1"></i> Treatment Details</p>
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label">Treatment Date <span class="text-danger">*</span></label>
                    <input th:field="*{treatmentDate}" type="date" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Next Treatment Date</label>
                    <input th:field="*{nextTreatmentDate}" type="date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Type</label>
                    <select th:field="*{treatmentType}" class="form-select">
                        <option value="">— Select —</option>
                        <option value="CURATIVE">Curative</option>
                        <option value="PREVENTIVE">Preventive</option>
                        <option value="VACCINATION">Vaccination</option>
                        <option value="DEWORMING">Deworming</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select th:field="*{treatmentStatus}" class="form-select">
                        <option value="ONGOING">Ongoing</option>
                        <option value="SCHEDULED">Scheduled</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="FAILED">Failed</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Dosage</label>
                    <input th:field="*{dosage}" type="text" class="form-control" placeholder="e.g. 5">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Dosage Unit</label>
                    <select th:field="*{dosageUnit}" class="form-select">
                        <option value="">—</option>
                        <option th:each="unit : ${T(rw.animalproduct.animal.production.entity.Medication.DosageUnit).values()}"
                                th:value="${unit}"
                                th:text="${unit.name()}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Frequency</label>
                    <select th:field="*{frequency}" class="form-select">
                        <option value="">—</option>
                        <option value="ONCE_DAILY">Once daily</option>
                        <option value="TWICE_DAILY">Twice daily</option>
                        <option value="THREE_TIMES_DAILY">Three times daily</option>
                        <option value="EVERY_OTHER_DAY">Every other day</option>
                        <option value="WEEKLY">Weekly</option>
                        <option value="BIWEEKLY">Bi-weekly</option>
                        <option value="AS_NEEDED">As needed</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Duration</label>
                    <input th:field="*{treatmentDuration}" type="text" class="form-control" placeholder="e.g. 7 days">
                </div>
            </div>

            <!-- ── Cost & Payment ── -->
            <p class="section-title"><i class="bi bi-cash-coin me-1"></i> Cost &amp; Payment</p>
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label">Treatment Cost (RWF)</label>
                    <input th:field="*{treatmentCost}" type="number" step="0.01" class="form-control" placeholder="0.00" id="treatmentCost">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Payment Status</label>
                    <select th:field="*{paymentStatus}" class="form-select">
                        <option value="UNPAID">Unpaid</option>
                        <option value="PARTIALLY_PAID">Partially Paid</option>
                        <option value="PAID">Paid</option>
                        <option value="OVERDUE">Overdue</option>
                        <option value="CANCELLED">Cancelled</option>
                        <option value="REFUNDED">Refunded</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Amount Paid (RWF)</label>
                    <input th:field="*{amountPaid}" type="number" step="0.01" class="form-control" placeholder="0.00" id="amountPaid">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Payment Due Date</label>
                    <input th:field="*{paymentDueDate}" type="date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Payment Method</label>
                    <select th:field="*{paymentMethod}" class="form-select">
                        <option value="">— Select —</option>
                        <option value="CASH">Cash</option>
                        <option value="BANK_TRANSFER">Bank Transfer</option>
                        <option value="MOBILE_MONEY">Mobile Money</option>
                        <option value="CHEQUE">Cheque</option>
                        <option value="INSURANCE">Insurance</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Payment Reference</label>
                    <input th:field="*{paymentReference}" type="text" class="form-control" placeholder="Transaction ID / Cheque #">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Payment Date</label>
                    <input th:field="*{paymentDate}" type="date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Balance (RWF)</label>
                    <input type="text" class="form-control" id="balanceDisplay" readonly style="background:#f8f9fa; font-weight:700; color:#1a202c;">
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-12">
                    <label class="form-label">Payment Notes</label>
                    <textarea th:field="*{paymentNotes}" class="form-control" rows="2"
                              placeholder="Additional payment information..."></textarea>
                </div>
            </div>

            <!-- ── Veterinarian ── -->
            <p class="section-title"><i class="bi bi-person-badge me-1"></i> Veterinarian</p>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Veterinarian</label>
                    <select th:field="*{veterinarianIdValue}" class="form-select">
                        <option value="">— Select Veterinarian —</option>
                        <option th:each="vet : ${veterinarianList}"
                                th:value="${vet.id}"
                                th:text="${vet.fullName + (vet.licenseNumber != null ? ' (Lic: ' + vet.licenseNumber + ')' : '')}">
                        </option>
                    </select>
                </div>
            </div>

            <!-- ── Notes ── -->
            <p class="section-title"><i class="bi bi-journal-text me-1"></i> Notes</p>
            <div class="mb-4">
                <textarea th:field="*{description}" class="form-control" rows="3"
                          placeholder="Observations, notes…"></textarea>
            </div>

            <!-- ── Actions ── -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-save me-1"></i> Update Treatment
                </button>
                <a th:href="${returnUrl != null ? returnUrl : '/livestock/treatment-report'}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Cancel &amp; Back
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    (function() {
        // ── Calculate Balance ──
        function calculateBalance() {
            const costInput = document.getElementById('treatmentCost');
            const paidInput = document.getElementById('amountPaid');
            const balanceDisplay = document.getElementById('balanceDisplay');

            if (!costInput || !paidInput || !balanceDisplay) return;

            const cost = parseFloat(costInput.value) || 0;
            const paid = parseFloat(paidInput.value) || 0;
            const balance = cost - paid;

            balanceDisplay.value = balance.toFixed(2) + ' RWF';
            if (balance < 0) {
                balanceDisplay.style.color = '#dc2626';
            } else if (balance === 0) {
                balanceDisplay.style.color = '#059669';
            } else {
                balanceDisplay.style.color = '#1a202c';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const costInput = document.getElementById('treatmentCost');
            const paidInput = document.getElementById('amountPaid');
            if (costInput) costInput.addEventListener('input', calculateBalance);
            if (paidInput) paidInput.addEventListener('input', calculateBalance);
            calculateBalance();
        });
    })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
