<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Category Performance Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .perf-card { background: #fff; border-radius: 12px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; transition: all 0.3s; }
        .perf-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .profit-badge { padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-bar-chart text-success"></i> Category Performance Report</h2>
        <button onclick="window.print()" class="btn btn-primary"><i class="bi bi-printer"></i> Print</button>
    </div>

    <!-- Date Filter -->
    <div class="card mb-4">
        <div class="card-body">
            <form method="get" action="/livestock/category-performance" class="row g-3">
                <div class="col-md-5"><label class="form-label fw-bold">From Date</label><input type="date" name="from" class="form-control" th:value="${fromDate}"></div>
                <div class="col-md-5"><label class="form-label fw-bold">To Date</label><input type="date" name="to" class="form-control" th:value="${toDate}"></div>
                <div class="col-md-2 d-flex align-items-end"><button type="submit" class="btn btn-primary w-100">Apply</button></div>
            </form>
        </div>
    </div>

    <div class="alert alert-info mb-4">
        <i class="bi bi-lightbulb"></i>
        <strong>Compare profitability across animal categories</strong> —
        See which animals generate the most profit and which incur the highest costs
    </div>

    <!-- Performance Cards -->
    <div class="row">
        <div class="col-12" th:each="perf : ${performances}">
            <div class="perf-card">
                <div class="row align-items-center">
                    <div class="col-md-3">
                        <h3 class="mb-2">
                            <i class="bi bi-grid-3x3-gap text-primary"></i>
                            <span th:text="${perf.categoryName}">Cow</span>
                        </h3>
                        <p class="text-muted mb-0">
                            <i class="bi bi-box"></i> <strong th:text="${perf.totalAnimals}">0</strong> animals
                        </p>
                    </div>

                    <div class="col-md-2 text-center border-start">
                        <div class="text-muted small text-uppercase mb-1">Revenue</div>
                        <div class="fs-5 fw-bold text-success" th:text="${#numbers.formatDecimal(perf.revenue, 0, 'COMMA', 0, 'POINT')} + ' RWF'">0 RWF</div>
                    </div>

                    <div class="col-md-2 text-center border-start">
                        <div class="text-muted small text-uppercase mb-1">Costs</div>
                        <div class="fs-5 fw-bold text-danger" th:text="${#numbers.formatDecimal(perf.costs, 0, 'COMMA', 0, 'POINT')} + ' RWF'">0 RWF</div>
                    </div>

                    <div class="col-md-2 text-center border-start">
                        <div class="text-muted small text-uppercase mb-1">Current Value</div>
                        <div class="fs-5 fw-bold text-info" th:text="${#numbers.formatDecimal(perf.currentValue, 0, 'COMMA', 0, 'POINT')} + ' RWF'">0 RWF</div>
                    </div>

                    <div class="col-md-3 text-center border-start">
                        <div class="text-muted small text-uppercase mb-2">Profit/Loss</div>
                        <div>
                                <span class="profit-badge"
                                      th:classappend="${perf.profit >= 0} ? 'bg-success text-white' : 'bg-danger text-white'"
                                      th:text="${perf.profit >= 0 ? '+' : '-'} + ${#numbers.formatDecimal(perf.profit.abs(), 0, 'COMMA', 0, 'POINT')} + ' RWF'">
                                    0 RWF
                                </span>
                        </div>
                        <small class="badge mt-2"
                               th:classappend="${perf.profitStatus == 'PROFIT'} ? 'bg-success' : 'bg-danger'"
                               th:text="${perf.profitStatus}">PROFIT</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${performances.isEmpty()}" class="alert alert-warning">
        <i class="bi bi-exclamation-triangle"></i> No category data available for the selected period.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
