<!--
  DEATHS REPORT ENHANCEMENT — cause-of-death, category, gender & monthly trend.

  1) In your existing deaths report Controller, inject DeathAnalyticsService
     and add to the model:

       model.addAttribute("deathAnalytics", deathAnalyticsService.generateCauseAnalytics(fromDate, toDate));

  2) Paste the block below into your existing deaths report template.
-->
<div class="row g-4 mb-4">
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-header bg-light"><h6 class="mb-0"><i class="bi bi-clipboard2-pulse"></i> Cause of Death</h6></div>
            <div class="card-body">
                <div th:each="entry : ${deathAnalytics.countByCause}" class="d-flex justify-content-between border-bottom py-2">
                    <span th:text="${entry.key}">CAUSE</span>
                    <strong class="text-danger" th:text="${entry.value}">0</strong>
                </div>
                <div th:if="${deathAnalytics.countByCause.isEmpty()}" class="text-muted text-center py-3">No deaths in this period.</div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-header bg-light"><h6 class="mb-0"><i class="bi bi-grid-fill"></i> By Category</h6></div>
            <div class="card-body">
                <div th:each="entry : ${deathAnalytics.countByCategory}" class="d-flex justify-content-between border-bottom py-2">
                    <span th:text="${entry.key}">CATEGORY</span>
                    <strong th:text="${entry.value}">0</strong>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-header bg-light"><h6 class="mb-0"><i class="bi bi-cash-stack"></i> Value Lost</h6></div>
            <div class="card-body text-center">
                <div class="display-6 fw-bold text-danger"
                     th:text="${#numbers.formatDecimal(deathAnalytics.totalValueLost,1,'COMMA',0,'POINT')} + ' RWF'">
                    0 RWF
                </div>
                <small class="text-muted">Total current-value of animals lost this period</small>
            </div>
        </div>
    </div>
</div>
