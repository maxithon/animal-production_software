<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Birth Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; }
        .page-header { background: white; border-bottom: 1px solid #dee2e6; padding: 20px 30px; margin-bottom: 24px; }
        .form-card { background: white; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); padding: 28px; margin: 0 24px 24px; }
        .section-divider { border-top: 1px dashed #dee2e6; margin: 20px 0; }
    </style>
</head>
<body>

<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4 class="mb-1"><i class="bi bi-pencil text-warning me-2"></i>Edit Birth Record</h4>
        <small class="text-muted">Update birth record details</small>
    </div>
    <a href="/livestock/births/list" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back
    </a>
</div>

<div class="form-card">

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/livestock/births/update/{id}(id=${birth.id})}" th:object="${birth}" method="post">

        <!-- Always a farm birth on edit -->
        <input type="hidden" name="isExternalBirth" value="false">

        <div class="alert alert-success d-flex align-items-center gap-2 mb-4">
            <i class="bi bi-house-heart-fill fs-5"></i>
            <div><strong>Farm Birth</strong> — born on this farm with a known mother.</div>
        </div>

        <!-- Mother -->
        <div class="mb-4">
            <label class="form-label fw-semibold">
                Mother Animal <span class="text-danger">*</span>
            </label>
            <select class="form-select" th:field="*{livestockIdValue}" required>
                <option value="">-- Select the mother animal --</option>
                <option th:each="ls : ${livestockList}"
                        th:value="${ls.id}"
                        th:selected="${ls.id.toString() == birth.livestockIdValue}"
                        th:text="${ls.tagNumber + (ls.livestockCategory != null ? ' (' + ls.livestockCategory.name + ')' : '')}">
                </option>
            </select>
        </div>

        <div class="section-divider"></div>

        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label fw-semibold">
                    Birth Date <span class="text-danger">*</span>
                </label>
                <input type="date" class="form-control" th:field="*{birthDate}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Number of Offspring</label>
                <input type="number" class="form-control" th:field="*{offspringCount}" min="1">
            </div>

            <div class="col-md-4">
                <label class="form-label">Offspring Gender</label>
                <select class="form-select" th:field="*{offspringGender}">
                    <option value="">-- Mixed / Unknown --</option>
                    <option value="MALE">Male</option>
                    <option value="FEMALE">Female</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Weaning Date</label>
                <input type="date" class="form-control" th:field="*{weaningDate}">
            </div>

            <div class="col-md-4">
                <label class="form-label">Next Breeding Date (Mother)</label>
                <input type="date" class="form-control" th:field="*{nextBreedingDate}">
            </div>

            <div class="col-md-4">
                <label class="form-label">Source Location / Notes on Origin</label>
                <input type="text" class="form-control" th:field="*{sourceLocation}"
                       placeholder="e.g. Born in Barn 2">
            </div>

            <div class="col-12">
                <label class="form-label">Notes</label>
                <textarea class="form-control" th:field="*{notes}" rows="3"></textarea>
            </div>
        </div>

        <div class="section-divider"></div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning">
                <i class="bi bi-save me-1"></i> Save Changes
            </button>
            <a href="/livestock/births/list" class="btn btn-outline-secondary">Cancel</a>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
