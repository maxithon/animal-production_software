<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Print Ear Tags</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --tag-w: 85mm;
            --tag-h: 45mm;
            --tag-bg: #ffffff;
            --accent: #1a5f7a;
            --text-dark: #0f172a;
            --text-mid: #475569;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #f1f5f9;
            padding: 20px;
            color: var(--text-dark);
        }

        .toolbar {
            background: white;
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .toolbar-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toolbar-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-print {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-print:hover { background: #155e75; color: white; transform: translateY(-1px); }
        .btn-back {
            background: #f1f5f9;
            color: var(--text-mid);
            border: 1.5px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-back:hover { background: #e2e8f0; color: var(--text-dark); }
        .count-badge {
            background: var(--accent);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .layout-toggle {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-mid);
        }
        .layout-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1.5px solid var(--border);
            background: #f8f9fb;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .layout-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .tags-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10mm;
            justify-content: flex-start;
        }
        .tags-grid.layout-2col { max-width: 200mm; margin: 0 auto; }
        .tags-grid.layout-3col { max-width: 300mm; margin: 0 auto; }

        .ear-tag {
            width: var(--tag-w);
            height: var(--tag-h);
            background: var(--tag-bg);
            border: 2px solid var(--accent);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 3px 12px rgba(26,95,122,.15);
            page-break-inside: avoid;
        }

        .tag-header {
            background: linear-gradient(135deg, var(--accent) 0%, #2e8b9e 100%);
            padding: 4px 8px 4px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 18px;
        }
        .tag-header.status-sold     { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .tag-header.status-dead     { background: linear-gradient(135deg, #475569, #334155); }
        .tag-header.status-transferred { background: linear-gradient(135deg, #4338ca, #3730a3); }

        .tag-number {
            font-family: 'DM Mono', monospace;
            font-size: 9.5pt;
            font-weight: 500;
            color: white;
            letter-spacing: 0.05em;
        }
        .tag-status-pill {
            font-size: 5.5pt;
            font-weight: 700;
            color: rgba(255,255,255,.9);
            background: rgba(255,255,255,.2);
            padding: 1px 6px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .tag-body {
            display: flex;
            flex: 1;
            padding: 5px 8px 5px 10px;
            gap: 7px;
        }
        .tag-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            min-width: 0;
        }
        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 4px;
            line-height: 1.3;
        }
        .info-label {
            font-size: 5pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            min-width: 30px;
            flex-shrink: 0;
            padding-top: 1px;
        }
        .info-value {
            font-size: 7pt;
            font-weight: 600;
            color: var(--text-dark);
            word-break: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }
        .info-value.large {
            font-size: 8.5pt;
            font-weight: 800;
        }

        .health-badge {
            font-size: 5.5pt;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 8px;
        }
        .health-HEALTHY         { background: #d1fae5; color: #065f46; }
        .health-SICK             { background: #fee2e2; color: #991b1b; }
        .health-UNDER_TREATMENT  { background: #fef9c3; color: #854d0e; }

        .tag-qr {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            flex-shrink: 0;
        }
        .tag-qr img {
            width: 32mm;
            height: 32mm;
            display: block;
            border: 1.5px solid var(--border);
            border-radius: 4px;
            image-rendering: pixelated;
        }
        .qr-label {
            font-size: 5pt;
            color: var(--text-mid);
            font-weight: 600;
            text-align: center;
        }

        .tag-footer {
            background: #f8fafc;
            border-top: 1px solid var(--border);
            padding: 3px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .footer-farm {
            font-size: 5pt;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .footer-id {
            font-family: 'DM Mono', monospace;
            font-size: 4.5pt;
            color: var(--text-mid);
        }

        .gender-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 3px;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .gender-dot.male   { background: #3b82f6; }
        .gender-dot.female { background: #ec4899; }

        .punch-hole {
            position: absolute;
            top: 50%;
            left: -6px;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f1f5f9;
            border: 1.5px dashed var(--accent);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .empty-state i { font-size: 3rem; display: block; margin-bottom: 12px; }

        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background: white; padding: 5mm; }
            .toolbar { display: none !important; }
            .tags-grid { gap: 6mm; }
            .ear-tag { box-shadow: none; border: 1.5px solid #1a5f7a; }
            @page {
                size: A4 portrait;
                margin: 8mm 8mm 8mm 8mm;
            }
        }
    </style>
</head>
<body>

<div class="toolbar" id="toolbar">
    <div class="toolbar-title">
        🏷️ Livestock Ear Tags
        <span class="count-badge" th:text="${animals != null ? animals.size() : 0} + ' tags'">0 tags</span>
    </div>
    <div class="toolbar-actions">
        <div class="layout-toggle">
            Layout:
            <button class="layout-btn active" onclick="setLayout(2, this)">2 col</button>
            <button class="layout-btn" onclick="setLayout(3, this)">3 col</button>
            <button class="layout-btn" onclick="setLayout(4, this)">4 col</button>
        </div>
        <a href="/livestock/list" class="btn-back">← Back to List</a>
        <button class="btn-print" onclick="window.print()">
            🖨️ Print All Tags
        </button>
    </div>
</div>

<div class="tags-grid layout-2col" id="tagsGrid">

    <div th:if="${animals == null or animals.empty}" class="empty-state" style="width:100%;">
        <span style="font-size:3rem;display:block;margin-bottom:12px;">🏷️</span>
        <p>No animals selected for printing.</p>
        <a href="/livestock/list" style="color:#1a5f7a;font-weight:700;margin-top:12px;display:inline-block;">← Back to Livestock List</a>
    </div>

    <div class="ear-tag"
         th:each="animal : ${animals}"
         th:classappend="${animal.status == 'SOLD'} ? ' sold' :
                        (${animal.status == 'DEAD'} ? ' dead' : '')">

        <div class="punch-hole"></div>

        <div class="tag-header"
             th:classappend="${animal.status == 'SOLD'}     ? ' status-sold'     :
                             (${animal.status == 'DEAD'}     ? ' status-dead'     :
                             (${animal.status == 'TRANSFERRED'} ? ' status-transferred' : ''))">
            <span class="tag-number" th:text="${animal.tagNumber}">TAG-001</span>
            <span class="tag-status-pill" th:text="${animal.status != null ? animal.status : 'ACTIVE'}">ACTIVE</span>
        </div>

        <div class="tag-body">

            <div class="tag-info">
                <div class="info-row">
                    <span class="info-label">Type</span>
                    <span class="info-value large"
                          th:text="${animal.livestockCategory != null ? animal.livestockCategory.name : 'N/A'}">Cattle</span>
                </div>

                <div class="info-row">
                    <span class="info-label">Sex</span>
                    <span class="info-value">
                        <span class="gender-dot"
                              th:classappend="${animal.gender == 'MALE'} ? ' male' :
                                             (${animal.gender == 'FEMALE'} ? ' female' : '')"></span>
                        <span th:text="${animal.gender != null ? animal.gender : 'Unknown'}">FEMALE</span>
                    </span>
                </div>

                <div class="info-row">
                    <span class="info-label">Health</span>
                    <span class="health-badge" th:classappend="'health-' + ${animal.healthStatus}"
                          th:text="${animal.healthStatusLabel()}">Healthy</span>
                </div>

                <div class="info-row">
                    <span class="info-label">Owner</span>
                    <span class="info-value"
                          th:text="${animal.beneficiary != null ?
                            animal.beneficiary.firstName + ' ' + animal.beneficiary.lastName :
                            'Unassigned'}">John Doe</span>
                </div>

                <div class="info-row">
                    <span class="info-label">Loc.</span>
                    <span class="info-value"
                          th:text="${animal.location != null ? animal.location.name : 'N/A'}">Sector A</span>
                </div>

                <div class="info-row">
                    <span class="info-label">Date</span>
                    <span class="info-value"
                          th:text="${animal.dateReceived != null ? #temporals.format(animal.dateReceived, 'dd/MM/yyyy') : '—'}">01/01/2024</span>
                </div>
            </div>

            <div class="tag-qr">
                <img th:src="@{/livestock/qr/image/{id}(id=${animal.id}, size=120)}"
                     alt="QR Code"
                     th:title="'QR for ' + ${animal.tagNumber}">
                <span class="qr-label">Scan to view<br>full record</span>
            </div>

        </div>

        <div class="tag-footer">
            <span class="footer-farm">🐄 Animal Production System</span>
            <span class="footer-id"
                  th:text="${#strings.substring(animal.id.toString(), 0, 8) + '...'}">abc12345...</span>
        </div>

    </div>
</div>

<script>
    function setLayout(cols, btn) {
        const grid = document.getElementById('tagsGrid');
        grid.className = 'tags-grid layout-' + cols + 'col';
        document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const colWidth = { 2: '85mm', 3: '82mm', 4: '78mm' };
        document.documentElement.style.setProperty('--tag-w', colWidth[cols] || '85mm');
    }
</script>
</body>
</html>
