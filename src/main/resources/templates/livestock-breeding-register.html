<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Record Breeding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; }
        .page-header { background: white; border-bottom: 1px solid #dee2e6; padding: 20px 30px; margin-bottom: 24px; }
        .form-card { background: white; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); padding: 28px; margin: 0 24px; }
        .section-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; color: #6c757d; letter-spacing: .05em; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4 class="mb-1"><i class="bi bi-heart-fill text-danger me-2"></i>Record Breeding Event</h4>
        <small class="text-muted">Track breeding to monitor pregnancies</small>
    </div>
    <a href="/livestock/breeding/list" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Back to Breeding
    </a>
</div>

<div class="form-card">

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/livestock/breeding/register/new}" th:object="${breeding}" method="post">

        <!-- Female Animal -->
        <div class="section-label">Female Animal (Mother)</div>
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Female Animal *</label>
                <select class="form-select" th:field="*{livestockIdValue}" required>
                    <option value="">Select female animal...</option>
                    <option th:each="ls : ${femaleLivestockList}"
                            th:value="${ls.id}"
                            th:text="${ls.tagNumber
                                + (ls.livestockCategory != null ? ' – ' + ls.livestockCategory.name : '')
                                + ' [' + (ls.gender != null ? ls.gender : 'Unknown') + ']'}">
                    </option>
                </select>
            </div>
        </div>

        <!-- Breeding Details -->
        <div class="section-label">Breeding Details</div>
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <label class="form-label fw-semibold">Breeding Date *</label>
                <input type="date" class="form-control" th:field="*{breedingDate}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-semibold">Breeding Method</label>
                <select class="form-select" th:field="*{breedingMethod}">
                    <option value="">Select method...</option>
                    <option value="NATURAL">Natural</option>
                    <option value="ARTIFICIAL_INSEMINATION">Artificial Insemination</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-semibold">Status</label>
                <select class="form-select" th:field="*{status}">
                    <option value="PENDING">Pending</option>
                    <option value="CONFIRMED_PREGNANT">Confirmed Pregnant</option>
                    <option value="FAILED">Failed</option>
                    <option value="COMPLETED">Completed</option>
                </select>
            </div>
        </div>

        <!-- Male Animal -->
        <div class="section-label">Male Animal (Optional)</div>
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Male Animal</label>
                <select class="form-select" th:field="*{maleLivestockIdValue}">
                    <option value="">Select male animal (if applicable)...</option>
                    <option th:each="ls : ${maleLivestockList}"
                            th:value="${ls.id}"
                            th:text="${ls.tagNumber
                                + (ls.livestockCategory != null ? ' – ' + ls.livestockCategory.name : '')
                                + ' [' + (ls.gender != null ? ls.gender : 'Unknown') + ']'}">
                    </option>
                </select>
            </div>
        </div>

        <!-- Dates -->
        <div class="section-label">Expected Dates</div>
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label class="form-label fw-semibold">Expected Pregnancy Check Date</label>
                <input type="date" class="form-control" th:field="*{expectedPregnancyCheckDate}">
                <small class="text-muted">Typically 21-30 days after breeding</small>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Expected Due Date</label>
                <input type="date" class="form-control" th:field="*{expectedDueDate}">
                <small class="text-muted">Cattle: ~283 days, Goats: ~150 days</small>
            </div>
        </div>

        <!-- Veterinarian -->
        <div class="section-label">Veterinarian (Optional)</div>
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Veterinarian</label>
                <select class="form-select" th:field="*{veterinarianIdValue}">
                    <option value="">Select veterinarian (if applicable)...</option>
                    <option th:each="vet : ${veterinarianList}"
                            th:value="${vet.id}"
                            th:text="${vet.firstName + ' ' + vet.lastName + (vet.licenseNumber != null ? ' (Lic: ' + vet.licenseNumber + ')' : '')}">
                    </option>
                </select>
            </div>
        </div>

        <!-- Notes -->
        <div class="row g-3 mb-4">
            <div class="col-md-8">
                <label class="form-label fw-semibold">Notes</label>
                <textarea class="form-control" th:field="*{notes}" rows="3"
                          placeholder="Any observations about this breeding event..."></textarea>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle me-1"></i> Save Breeding Record
            </button>
            <a href="/livestock/breeding/list" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
