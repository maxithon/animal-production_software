<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Animal Registered</title>
</head>
<body style="margin:0;padding:0;background:#f0f4f8;font-family:Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f4f8;padding:24px 0;">
    <tr>
        <td align="center">
            <table width="500" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
                <tr>
                    <td style="background:linear-gradient(135deg,#1a5f7a,#2e8b9e);padding:22px 28px;color:#fff;">
                        <div style="font-size:26px;" th:text="${emoji}">🐄📋</div>
                        <div style="font-size:18px;font-weight:700;margin-top:4px;" th:text="${title}">New Animal Registered</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 28px;">
                        <p style="font-size:14px;color:#334155;margin:0 0 16px;">
                            A new animal has just been registered in the system.
                        </p>

                        <table width="100%" cellpadding="6" cellspacing="0" style="font-size:13px;color:#1e293b;">
                            <tr>
                                <td style="color:#64748b;font-weight:600;width:160px;">Tag Number</td>
                                <td th:text="${tagNumber}">TAG</td>
                            </tr>
                            <tr>
                                <td style="color:#64748b;font-weight:600;">Category</td>
                                <td th:text="${category}">Category</td>
                            </tr>
                            <tr>
                                <td style="color:#64748b;font-weight:600;">Gender</td>
                                <td th:text="${gender}">Gender</td>
                            </tr>
                            <tr>
                                <td style="color:#64748b;font-weight:600;">Acquisition Method</td>
                                <td th:text="${acquisitionMethod}">Method</td>
                            </tr>
                            <tr>
                                <td style="color:#64748b;font-weight:600;">Initial Value</td>
                                <td th:text="${currentValue}">Not yet valued</td>
                            </tr>
                            <tr>
                                <td style="color:#64748b;font-weight:600;">Date</td>
                                <td th:text="${today}">Date</td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:14px 28px;background:#f8fafc;font-size:11px;color:#94a3b8;">
                        Automated notification from the Livestock Management System.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
