# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_animalproduction
spring.datasource.username=postgres
spring.datasource.password=Kigali@10
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# JPA / HIBERNATE CONFIGURATION
# =============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
server.port=8888
server.servlet.context-path=/

# =============================================================================
# SECURITY
# =============================================================================
spring.security.oauth2.client.provider.default.authorization-uri=/login

# =============================================================================
# FILE UPLOAD CONFIGURATION
# =============================================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
server.tomcat.max-http-post-size=52428800

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging.level.root=INFO
logging.level.rw.animalproduct.animal.production=DEBUG
logging.level.org.springframework.security=DEBUG

# =============================================================================
# EMAIL DEBUG LOGGING - CRITICAL FOR TROUBLESHOOTING
# =============================================================================
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG
logging.level.rw.animalproduct.animal.production.services=DEBUG
logging.level.rw.animalproduct.animal.production.scheduler=DEBUG
logging.level.rw.animalproduct.animal.production.controller=DEBUG

# =============================================================================
# THYMELEAF CONFIGURATION
# =============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# =============================================================================
# GMAIL SMTP CONFIGURATION
# IMPORTANT: Use an App Password, NOT your regular Gmail password.
# Steps to generate App Password:
#   1. Go to https://myaccount.google.com/security
#   2. Enable 2-Step Verification
#   3. Search "App passwords" ? generate one for "Mail" / "Other"
#   4. Paste the 16-char password below (no spaces)
# =============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=samuelhabanabakize55@gmail.com
spring.mail.password=asarsxdaygagfkep

# SMTP Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Additional SMTP settings for reliability
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=true

# =============================================================================
# NOTIFICATION SETTINGS - CRITICAL: MUST BE CONFIGURED CORRECTLY
# =============================================================================
# Recipients - comma separated list of email addresses
app.notifications.recipients=samuelhabanabakize55@gmail.com

# From address - must be same as spring.mail.username for Gmail
app.notifications.from=samuelhabanabakize55@gmail.com

# Enable/disable all email notifications (set to false to disable globally)
app.notifications.enabled=true

# =============================================================================
# AUTOMATIC NOTIFICATION SCHEDULING SETTINGS
# =============================================================================
# Weekly schedule for automatic notifications (default: Monday at 8:00 AM)
# Cron expression: second minute hour day month dayOfWeek
# 0 0 8 ? * MON  ? Every Monday at 8:00 AM
app.notifications.scheduler.cron=0 0 8 ? * MON

# Days to look ahead for "ready to breed" notifications
app.notifications.ready-to-breed-lookahead-days=7

# Days to look ahead for "ready to give birth" notifications
app.notifications.birth-lookahead-days=14

# =============================================================================
# ADDITIONAL SPRING BOOT PROPERTIES
# =============================================================================
# Spring Boot Actuator (optional - for health checks)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Internationalization (if needed)
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Jackson JSON configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Kigali
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# =============================================================================
# DATASOURCE CONNECTION POOL (HikariCP) - RECOMMENDED OPTIMIZATIONS
# =============================================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =============================================================================
# NOTIFICATION SCHEDULER ? ADDED FOR STARTUP CATCH-UP
# =============================================================================
# Days after breeding before nudging for a pregnancy check
app.notifications.pregnancy-check-after-days=21

# Which day the startup catch-up should trigger (MONDAY, TUESDAY, ...)
app.notifications.scheduler.day-of-week=MONDAY

# Hour of the day after which the catch-up runs (24-hour format)
app.notifications.scheduler.hour=8

spring.profiles.active=dev

