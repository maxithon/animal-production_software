# =============================================================================
# application.properties — Animal Production System
# =============================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/db_animalproduction
spring.datasource.username=postgres
spring.datasource.password=Kigali@10
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

server.port=8888

# Security - redirect to custom login page
spring.security.oauth2.client.provider.default.authorization-uri=/login

server.servlet.context-path=/

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
server.tomcat.max-http-post-size=52428800

# ── LOGGING ─────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.rw.animalproduct.animal.production=DEBUG
logging.level.org.springframework.security=DEBUG
# IMPORTANT: Enable mail debug so you can see exactly what fails
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG

spring.thymeleaf.cache=false

